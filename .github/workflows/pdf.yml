# Builds full-quality viewing-room PDFs (see scripts/build-pdf.js).
#
# Manual: Actions > "Viewing room PDFs" > Run workflow, type the room's URL
# slug. Leave it empty to refresh every room that already has a PDF.
# Nightly: refreshes every room that already has a PDF and removes the PDFs
# of rooms that have expired.
name: Viewing room PDFs

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "URL slug of the room (empty = refresh all rooms that already have a PDF)"
        required: false
        default: ""
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: viewing-room-pdfs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-pdf.js
        env:
          SLUG: ${{ github.event.inputs.slug }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Not secret: where the files go and the bucket's public address.
          R2_ACCOUNT_ID: 9727e28dd1da07947109d7cb4812a2bb
          R2_BUCKET: diez-gallery
          R2_PUBLIC_URL: https://pub-8b157f2d1d4d40ab9a88c9d9b9639d7b.r2.dev
